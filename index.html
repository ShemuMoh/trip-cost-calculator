<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Cost Calculator</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --border: #e5e7eb;
    --result-bg: #1a1d21;
    --result-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #1a1d23;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-soft: #1e2a44;
      --border: #2d323b;
      --result-bg: #f3f4f6;
      --result-text: #0f1115;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .ticker {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid #dc2626;
    border-radius: 12px;
    padding: 0.75rem 1rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .ticker.show { display: block; }
  .ticker-head {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #dc2626;
    margin-bottom: 0.55rem;
  }
  .ticker-head .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #dc2626;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .ticker-prices {
    display: flex;
    gap: 0.6rem;
  }
  .fuel-chip {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.1rem;
    border: 1.5px solid var(--border);
    background: var(--bg);
    border-radius: 10px;
    padding: 0.5rem 0.75rem;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .fuel-chip:hover { border-color: var(--accent); }
  .fuel-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .fuel-chip .fuel-name {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .fuel-chip .fuel-price {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .ticker-note {
    margin-top: 0.5rem;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.35rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .field { margin-bottom: 1.1rem; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap .prefix, .input-wrap .suffix {
    padding: 0 0.75rem;
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  input {
    flex: 1;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 1.05rem;
    padding: 0.7rem 0.75rem;
    outline: none;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .result {
    background: var(--result-bg);
    color: var(--result-text);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    text-align: center;
    margin-top: 1.5rem;
  }
  .result .label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.7;
    margin-bottom: 0.25rem;
  }
  .result .value {
    font-size: 2.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .breakdown {
    display: flex;
    justify-content: space-around;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  .breakdown strong {
    display: block;
    color: var(--text);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }
  footer {
    margin-top: 1.25rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
  <div class="wrap">

  <aside class="ticker" id="ticker" aria-live="polite">
    <div class="ticker-head"><span class="dot"></span>London Fuel Prices — Today's Average</div>
    <div class="ticker-prices">
      <button class="fuel-chip" id="chipPetrol" type="button">
        <span class="fuel-name">⛽ Petrol (E10)</span>
        <span class="fuel-price" id="petrolPrice">—</span>
      </button>
      <button class="fuel-chip" id="chipDiesel" type="button">
        <span class="fuel-name">🛢 Diesel (B7)</span>
        <span class="fuel-price" id="dieselPrice">—</span>
      </button>
    </div>
    <div class="ticker-note" id="tickerNote">Tap a price to use it in the calculator.</div>
  </aside>

  <main class="card">
    <h1>⛽ Trip Cost Calculator</h1>
    <p class="subtitle">Work out how much your journey will cost in fuel.</p>

    <div class="field">
      <label for="price">Petrol price</label>
      <div class="input-wrap">
        <span class="prefix">£</span>
        <input type="number" id="price" inputmode="decimal" min="0" step="0.01" placeholder="1.45" value="1.45">
        <span class="suffix">per litre</span>
      </div>
    </div>

    <div class="field">
      <label for="mpg">Fuel economy</label>
      <div class="input-wrap">
        <input type="number" id="mpg" inputmode="decimal" min="0" step="0.1" placeholder="40" value="40">
        <span class="suffix">MPG</span>
      </div>
    </div>

    <div class="field">
      <label for="miles">Trip distance</label>
      <div class="input-wrap">
        <input type="number" id="miles" inputmode="decimal" min="0" step="1" placeholder="100" value="100">
        <span class="suffix">miles</span>
      </div>
    </div>

    <div class="result">
      <div class="label">Estimated trip cost</div>
      <div class="value" id="cost">£0.00</div>
    </div>

    <div class="breakdown">
      <div>Fuel used<strong id="litres">0 L</strong></div>
      <div>Gallons<strong id="gallons">0 gal</strong></div>
      <div>Cost per mile<strong id="perMile">0p</strong></div>
    </div>

    <footer>Uses UK gallons (1 gal = 4.546 litres)</footer>
  </main>

  </div>

<script>
  const LITRES_PER_UK_GALLON = 4.54609;
  const inputs = ['price', 'mpg', 'miles'].map(id => document.getElementById(id));

  function calculate() {
    const [price, mpg, miles] = inputs.map(el => parseFloat(el.value));

    if (!(price > 0) || !(mpg > 0) || !(miles >= 0)) {
      document.getElementById('cost').textContent = '£0.00';
      document.getElementById('litres').textContent = '0 L';
      document.getElementById('gallons').textContent = '0 gal';
      document.getElementById('perMile').textContent = '0p';
      return;
    }

    const gallons = miles / mpg;
    const litres = gallons * LITRES_PER_UK_GALLON;
    const cost = litres * price;
    const pencePerMile = miles > 0 ? (cost / miles) * 100 : 0;

    document.getElementById('cost').textContent = '£' + cost.toFixed(2);
    document.getElementById('litres').textContent = litres.toFixed(1) + ' L';
    document.getElementById('gallons').textContent = gallons.toFixed(1) + ' gal';
    document.getElementById('perMile').textContent = pencePerMile.toFixed(1) + 'p';
  }

  inputs.forEach(el => el.addEventListener('input', calculate));
  calculate();

  // --- London fuel price banner ---
  const priceInput = document.getElementById('price');
  const chips = { petrol: document.getElementById('chipPetrol'), diesel: document.getElementById('chipDiesel') };

  function usePrice(pence, chip) {
    priceInput.value = (pence / 100).toFixed(2);
    Object.values(chips).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    calculate();
  }

  fetch('/api/prices')
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(data => {
      if (!data.petrolPence && !data.dieselPence) return;

      if (data.petrolPence) {
        document.getElementById('petrolPrice').textContent = data.petrolPence.toFixed(1) + 'p/L';
        chips.petrol.addEventListener('click', () => usePrice(data.petrolPence, chips.petrol));
      } else {
        chips.petrol.disabled = true;
      }

      if (data.dieselPence) {
        document.getElementById('dieselPrice').textContent = data.dieselPence.toFixed(1) + 'p/L';
        chips.diesel.addEventListener('click', () => usePrice(data.dieselPence, chips.diesel));
      } else {
        chips.diesel.disabled = true;
      }

      if (data.stationCount) {
        document.getElementById('tickerNote').textContent =
          'Average of ' + data.stationCount + ' London stations. Tap a price to use it in the calculator.';
      }

      document.getElementById('ticker').classList.add('show');
    })
    .catch(() => { /* no banner if prices are unavailable (e.g. offline or local file) */ });
</script>
</body>
</html>
